<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>domhw-1.html</title>
</head>
<body>
    <script type="text/javascript">
        fetch('book2.xml')
            .then(response => response.text())
            .then(str => (new window.DOMParser()).parseFromString(str, "text/xml"))
            .then(xmlDom => {
                let books = xmlDom.documentElement.childNodes;
                for (let i = 0; i < books.length; i++) {
                    if (books[i].nodeType == 1) { // Process only element nodes (type 1)
                        document.write(books[i].tagName);
                        document.write("<br />");
                        let y = books[i].childNodes;
                        for (let j = 0; j < y.length; j++) {
                            if (y[j].nodeType == 1) {
                                document.write(y[j].tagName + " : " + y[j].textContent);
                                document.write("<br />");
                            }
                        }
                    }
                }
            })
            .catch(error => console.error('Error loading XML:', error));
    </script>
</body>
</html>
