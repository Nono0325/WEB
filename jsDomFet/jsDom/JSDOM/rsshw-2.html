<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>rsshw-2.html</title>
    <style>
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            margin: 20px;
        }
        .rss-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .rss-table td {
            border: 1px solid #777;
            padding: 6px 10px;
            font-size: 15px;
        }
        .rss-header {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="channel-info"></div>
    <div id="items-container"></div>

    <script type="text/javascript">
        fetch('freewayrss.xml')
            .then(response => response.text())
            .then(str => (new window.DOMParser()).parseFromString(str, "text/xml"))
            .then(xmlDom => {
                let channelNode = xmlDom.getElementsByTagName("channel")[0];
                let chTitle = channelNode.getElementsByTagName("title")[0].textContent;
                let chPubDate = channelNode.getElementsByTagName("pubDate")[0].textContent;
                let chLanguage = channelNode.getElementsByTagName("language")[0].textContent;

                let channelHtml = "標題: " + chTitle + "<br />";
                channelHtml += "發行日期: " + chPubDate + "<br />";
                channelHtml += "語言: " + chLanguage + "<br /><br />";
                document.getElementById("channel-info").innerHTML = channelHtml;

                let items = xmlDom.getElementsByTagName("item");
                let itemsHtml = "";
                for (let i = 0; i < items.length; i++) {
                    let title = items[i].getElementsByTagName("title")[0]?.textContent || "";
                    let link = items[i].getElementsByTagName("link")[0]?.textContent || "";
                    let pubDate = items[i].getElementsByTagName("pubDate")[0]?.textContent || "";

                    // 第 1, 3, 5 筆 (奇數) 背景為淡綠色；第 2, 4, 6 筆 (偶數) 為白色
                    let bgColor = (i % 2 === 0) ? "#c9ebb0" : "#ffffff";

                    itemsHtml += "<table class='rss-table' style='background-color: " + bgColor + ";'>";
                    itemsHtml += "<tr><td class='rss-header' style='background-color: " + bgColor + ";'>第 " + (i + 1) + " 筆資訊</td></tr>";
                    itemsHtml += "<tr><td>標題: " + title + "</td></tr>";
                    itemsHtml += "<tr><td>鏈結網址: " + link + "</td></tr>";
                    itemsHtml += "<tr><td>發佈日期時間: " + pubDate + "</td></tr>";
                    itemsHtml += "</table>";
                }
                document.getElementById("items-container").innerHTML = itemsHtml;
            })
            .catch(error => console.error('Error loading XML:', error));
    </script>
</body>
</html>
